name: Flutter Release

on:
  workflow_dispatch:
    inputs:
      ios_signed:
        description: 'Use Apple certificate and provisioning profile for the IPA'
        required: false
        default: false
        type: boolean
      ios_only:
        description: 'Build only iOS for native build troubleshooting'
        required: false
        default: false
        type: boolean
permissions:
  contents: read

concurrency:
  group: flutter-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.2'
  GO_VERSION: '1.23.12'
  NDK_VERSION: '28.2.13676358'

jobs:
  validate:
    name: Flutter and native checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      package_version: ${{ steps.version.outputs.package_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read and check release version
        id: version
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          pubspec = Path('pubspec.yaml').read_text(encoding='utf-8')
          match = re.search(r'^version: ([0-9]+\.[0-9]+\.[0-9]+)\+([1-9][0-9]*)$', pubspec, re.MULTILINE)
          if not match:
              raise SystemExit('pubspec.yaml must contain a version with a positive integer build number')
          version, build = match.groups()
          about = Path('lib/features/settings/about_page.dart').read_text(encoding='utf-8')
          if f"const appVersion = '{version}';" not in about:
              raise SystemExit('appVersion must match pubspec.yaml')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={version}\npackage_version={version}-{build}\n')
          PY
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: native/tsnet/go.sum
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Go lifecycle and race tests
        working-directory: native/tsnet
        run: go test -race ./...
      - name: Check native resources and license inventory
        run: |
          python3 -m py_compile tool/build_tsnet.py tool/build_ios_adb.py tool/collect_native_licenses.py tool/verify_native.py
          python3 -m unittest discover -s tool -p 'test_*.py'
          python3 tool/collect_native_licenses.py go --check
          python3 tool/verify_native.py

  android:
    name: Android split APKs
    if: ${{ inputs.ios_only != true }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: native/tsnet/go.sum
      - name: Build application-scoped tsnet AAR
        run: |
          sdkmanager "ndk;${NDK_VERSION}"
          python3 tool/build_tsnet.py android
      - run: flutter pub get
      - name: Prepare Flutter Android build files
        run: flutter build apk --debug --config-only
      - name: Kotlin ADB and scrcpy tests
        working-directory: android
        run: bash gradlew :app:testDebugUnitTest --console=plain
      - run: python3 tool/verify_native.py --android
      - name: Prepare Android signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'ANDROID_KEYSTORE_BASE64 is required'; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo 'ANDROID_KEYSTORE_PASSWORD is required'; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo 'ANDROID_KEY_ALIAS is required'; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo 'ANDROID_KEY_PASSWORD is required'; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.jks"
          cat > "$GITHUB_WORKSPACE/keystore.properties" <<EOF
          storeFile=release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: Build and verify APKs for each ABI
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64 \
            --android-project-arg=force-version-code-ignoring-abi=true
          mkdir -p build/release/android
          for ABI in armeabi-v7a arm64-v8a x86_64; do
            APK="build/app/outputs/flutter-apk/app-${ABI}-release.apk"
            python3 tool/verify_native.py --apk "$APK" --abi "$ABI"
            cp "$APK" "build/release/android/nkas-mobile-${PACKAGE_VERSION}-android-${ABI}.apk"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nkas-android-apk
          path: build/release/android/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: nkas-android-tests
          path: build/app/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  ios:
    name: iOS frameworks, XCTest and IPA
    needs: validate
    runs-on: macos-15
    timeout-minutes: 120
    env:
      PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: native/tsnet/go.sum
      - name: Build and verify native XCFrameworks
        run: |
          xcodebuild -version
          cmake --version
          python3 tool/build_tsnet.py ios
          python3 tool/build_ios_adb.py
          python3 tool/collect_native_licenses.py ios --check
          python3 tool/verify_native.py --ios
      - run: flutter pub get
      - run: flutter build ios --simulator --debug --no-codesign
      - name: Run protocol and input XCTest on an available iPhone simulator
        run: |
          xcrun simctl list devices available --json > build/ios/simulators.json
          SIMULATOR_ID=$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('build/ios/simulators.json').read_text())
          phones = [device for runtime, devices in data['devices'].items() if '.iOS-' in runtime
                    for device in devices if device.get('isAvailable') and device['name'].startswith('iPhone')]
          if not phones:
              raise SystemExit('No available iPhone simulator runtime')
          print(phones[0]['udid'])
          PY
          )
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -destination-timeout 120 \
            -resultBundlePath build/ios/NativeTests.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Install Apple signing assets
        if: ${{ inputs.ios_signed == true }}
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          test -n "$IOS_CERTIFICATE_BASE64" || { echo 'IOS_CERTIFICATE_BASE64 is required'; exit 1; }
          test -n "$IOS_CERTIFICATE_PASSWORD" || { echo 'IOS_CERTIFICATE_PASSWORD is required'; exit 1; }
          test -n "$IOS_PROVISIONING_PROFILE_BASE64" || { echo 'IOS_PROVISIONING_PROFILE_BASE64 is required'; exit 1; }
          test -n "$IOS_TEAM_ID" || { echo 'IOS_TEAM_ID is required'; exit 1; }
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-nkas-build-$(date +%s)}"
          KEYCHAIN="$RUNNER_TEMP/nkas-build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print:UUID' "$RUNNER_TEMP/profile.plist")
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          export IOS_PROFILE_UUID="$PROFILE_UUID"
          echo "IOS_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          perl -0pi -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;\n\t\t\t\tDEVELOPMENT_TEAM = $ENV{IOS_TEAM_ID};\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = $ENV{IOS_PROFILE_UUID};/g' ios/Runner.xcodeproj/project.pbxproj
      - name: Build unsigned IPA for personal re-signing
        if: ${{ inputs.ios_signed != true }}
        run: |
          flutter build ios --release --no-codesign
          python3 tool/verify_native.py --app build/ios/iphoneos/Runner.app
          mkdir -p build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          (cd build/ios/iphoneos && zip -qry "nkas-mobile-${PACKAGE_VERSION}-unsigned.ipa" Payload)
      - name: Build signed IPA
        if: ${{ inputs.ios_signed == true }}
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          profile = os.environ['IOS_PROFILE_UUID']
          options = {'method': 'release-testing', 'teamID': os.environ['IOS_TEAM_ID'], 'signingStyle': 'manual',
                     'provisioningProfiles': {'com.megumiss.nkas.mobile': profile}}
          Path('ios/ExportOptions.plist').write_bytes(plistlib.dumps(options))
          PY
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
          python3 tool/verify_native.py --app build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app
      - name: Stage versioned IPA
        env:
          IOS_SIGNED: ${{ inputs.ios_signed }}
        run: |
          if [[ "$IOS_SIGNED" == 'true' ]]; then
            IPAS=(build/ios/ipa/*.ipa)
            SIGNING=signed
          else
            IPAS=(build/ios/iphoneos/*.ipa)
            SIGNING=unsigned
          fi
          [[ ${#IPAS[@]} -eq 1 && -f "${IPAS[0]}" ]] || { echo 'Expected exactly one IPA'; exit 1; }
          mkdir -p build/release/ios
          cp "${IPAS[0]}" "build/release/ios/nkas-mobile-${PACKAGE_VERSION}-ios-${SIGNING}.ipa"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nkas-ios-ipa
          path: build/release/ios/*.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: nkas-ios-tests
          path: |
            build/ios/NativeTests.xcresult/
            build/native-adb/iphoneos/arm64/linked-archives.json
            build/native-adb/iphonesimulator/*/linked-archives.json
          if-no-files-found: ignore
      - name: Remove temporary signing keychain
        if: ${{ always() && inputs.ios_signed == true }}
        run: |
          if test -f "$RUNNER_TEMP/nkas-build.keychain-db"; then
            security delete-keychain "$RUNNER_TEMP/nkas-build.keychain-db"
          fi

  release:
    name: Publish versioned GitHub Release
    needs: [validate, android, ios]
    if: ${{ inputs.ios_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    concurrency:
      group: flutter-release-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v${{ needs.validate.outputs.version }}
      PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
      IOS_SIGNED: ${{ inputs.ios_signed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Check release tag points to this build
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            TAG_COMMIT=$(git rev-parse "$RELEASE_TAG^{commit}")
            [[ "$TAG_COMMIT" == "$GITHUB_SHA" ]] || { echo "Tag $RELEASE_TAG belongs to another commit; bump the version before publishing"; exit 1; }
          fi
      - name: Download verified packages from this run
        run: |
          gh run download "$GITHUB_RUN_ID" --name nkas-android-apk --dir release-assets
          gh run download "$GITHUB_RUN_ID" --name nkas-ios-ipa --dir release-assets
      - name: Check complete release assets and write checksums
        working-directory: release-assets
        run: |
          for ABI in armeabi-v7a arm64-v8a x86_64; do
            test -s "nkas-mobile-${PACKAGE_VERSION}-android-${ABI}.apk"
          done
          SIGNING=unsigned
          if [[ "$IOS_SIGNED" == 'true' ]]; then SIGNING=signed; fi
          test -s "nkas-mobile-${PACKAGE_VERSION}-ios-${SIGNING}.ipa"
          sha256sum ./*.apk ./*.ipa > SHA256SUMS
      - name: Create or update release for this version
        run: |
          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -v -x "$RELEASE_TAG" | head -n1 || true)
          cat > release-notes.md <<EOF
          NKAS Mobile ${RELEASE_TAG}（构建标识：${PACKAGE_VERSION}）

          Android 提供 armeabi-v7a、arm64-v8a、x86_64 三种分包 APK。
          iOS IPA 文件名标明 signed / unsigned；unsigned 包需要自行签名后安装。
          SHA256SUMS 包含全部安装包的 SHA-256 校验值。
          EOF
          if [[ -n "$PREV_TAG" ]]; then
            {
              printf '\n自 %s 以来的提交：\n\n' "$PREV_TAG"
              git log --no-merges --pretty='- %s (%h)' "$PREV_TAG..$GITHUB_SHA"
            } >> release-notes.md
          else
            {
              printf '\n全部提交（未找到上一个版本标签）：\n\n'
              git log --no-merges --pretty='- %s (%h)' "$GITHUB_SHA"
            } >> release-notes.md
          fi
          cat >> release-notes.md <<EOF

          源码提交：${GITHUB_SHA}
          构建记录：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          if gh release view "$RELEASE_TAG" --json targetCommitish --jq .targetCommitish > release-target.txt 2>/dev/null; then
            if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
              [[ "$(cat release-target.txt)" == "$GITHUB_SHA" ]] || { echo 'Existing release draft belongs to another commit'; exit 1; }
            fi
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" \
              --draft --generate-notes --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/*.apk release-assets/*.ipa release-assets/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false
