name: Android checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: cd android && ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest
      - run: flutter build apk --debug
      - run: test -s build/app/outputs/flutter-apk/app-debug.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --no-codesign

  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify license metadata
        shell: bash
        run: |
          test -s LICENSE
          test -s NOTICE
          grep -q "Apache License" LICENSE
          grep -q "scrcpy server v4.1" NOTICE
          grep -q "scrcpyServerSha256" android/app/build.gradle.kts
