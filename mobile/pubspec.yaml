name: nkas_mobile_preview
description: NKAS mobile UI preview built with Flutter and shadcn_ui.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  shadcn_ui: ^0.56.3
  lucide_icons_flutter: ^3.1.19
  http: ^1.6.0
  shared_preferences: 2.5.3
  web_socket_channel: ^3.0.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/nkas.png
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-VF.ttf
