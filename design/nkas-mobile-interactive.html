<script>

        root.querySelectorAll('[data-setup-step]').forEach((row) => {
          const toggle = () => {
            const key = row.dataset.setupStep;
            if (extraMap[key]) state.setupCollapsed[key] = !state.setupCollapsed[key];
            else state.setupExpanded = state.setupExpanded === key ? '' : key;
            draw();
          };
          row.addEventListener('click', toggle);
          row.addEventListener('keydown', (event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); toggle(); } });
        });
        bind('#np-setup-permission', (el) => { el.textContent = '已打开设置'; el.disabled = true; });
        bind('#np-setup-open-termux', (el) => { el.textContent = '已打开 Termux'; el.disabled = true; });
        bind('#np-setup-copy-command', (el) => { navigator.clipboard?.writeText("mkdir -p ~/.termux\necho 'allow-external-apps=true' > ~/.termux/termux.properties"); el.textContent = '已复制'; });
        bind('#np-setup-pair', (el) => { el.textContent = '已启动'; el.disabled = true; });
        bind('#np-setup-action', () => { if (blocked) { state.page = 'star-verify'; draw(); return; } state.setupRunning = true; state.setupStage = 3; draw(); window.setTimeout(() => { state.setupRunning = false; state.setupStage = steps.length; state.initialized = true; draw(); }, 1000); });
      }
      function drawSettings() { content.innerHTML = `<p class="np-kicker">连接、验证、外观与通知</p><p class="np-subtitle">远程部署时，App 只负责控制；原始 WebUI 作为完整能力兜底。</p><section class="np-setting-group"><p class="np-group-label">验证与初始化</p><div class="np-setting-surface"><div class="np-setting"><div class="np-event-icon">${icon('shield-check')}</div><div class="np-setting-copy"><p class="np-setting-name">STAR 验证</p><p class="np-setting-detail">设备身份与授权状态 · ${state.starAuthorized ? '已验证' : '待验证'}</p></div><button class="np-icon" id="np-star-verify" type="button" aria-label="打开 STAR 验证">${icon('chevron-right')}</button></div><div class="np-setting"><div class="np-event-icon warn">${icon('sparkles')}</div><div class="np-setting-copy"><p class="np-setting-name">初始化 NKAS</p><p class="np-setting-detail">${state.initialized ? '环境与服务已准备就绪' : '完成后才可以部署实例'}</p></div><button class="np-icon" id="np-settings-init" type="button" aria-label="打开初始化">${icon('chevron-right')}</button></div></div></section><section class="np-setting-group"><p class="np-group-label">后端连接</p><div class="np-setting-surface"><div class="np-setting"><div class="np-event-icon">${icon('server')}</div><div class="np-setting-copy"><p class="np-setting-name">后端地址</p><p class="np-setting-detail">${state.backend || 'http://127.0.0.1:12271'}</p></div><button class="np-icon" id="np-backend-edit" type="button" aria-label="修改后端地址">${icon('pencil')}</button></div><div class="np-setting"><div class="np-event-icon">${icon('globe-2')}</div><div class="np-setting-copy"><p class="np-setting-name">原始 WebUI</p><p class="np-setting-detail">打开完整 WebUI，处理暂未原生实现的功能</p></div><button class="np-icon" id="np-open-webui" type="button" aria-label="打开原始 WebUI">${icon('external-link')}</button></div><div class="np-setting" id="np-open-update" role="button" tabindex="0"><div class="np-event-icon">${icon('square-arrow-up')}</div><div class="np-setting-copy"><p class="np-setting-name">更新</p><p class="np-setting-detail">检查源码的新版本</p></div>${icon('chevron-right')}</div></div></section><section class="np-setting-group"><p class="np-group-label">外观与通知</p><div class="np-setting-surface"><div class="np-setting"><div class="np-setting-copy"><p class="np-setting-name">主题</p><p class="np-setting-detail">当前：${state.theme}</p></div><div class="np-segment"><button data-theme="浅色" class="${state.theme === '浅色' ? 'active' : ''}" type="button">浅色</button><button data-theme="深色" class="${state.theme === '深色' ? 'active' : ''}" type="button">深色</button></div></div><div class="np-setting"><div class="np-setting-copy"><p class="np-setting-name">后台通知</p><p class="np-setting-detail">任务完成或发生错误时提醒</p></div><button class="np-switch on" id="np-notify" aria-label="后台通知" type="button"></button></div><div class="np-setting"><div class="np-setting-copy"><p class="np-setting-name">日志自动滚动</p><p class="np-setting-detail">新日志到达时滚动到底部</p></div><button class="np-switch ${state.autoScroll ? 'on' : ''}" id="np-autoscroll" aria-label="日志自动滚动" type="button"></button></div></div></section><section class="np-setting-group"><p class="np-group-label">关于</p><div class="np-setting-surface"><div class="np-setting"><div class="np-setting-copy"><p class="np-setting-name">NKAS Mobile Preview</p><p class="np-setting-detail">Flutter + shadcn_ui · 0.1.0-preview</p></div>${icon('chevron-right')}</div></div></section>`; bind('#np-settings-init', openInit); bind('#np-star-verify', openStarVerify); bind('#np-backend-edit', openBackendEditor); bind('#np-open-webui', openWebui); bind('#np-open-update', () => { state.page = 'update'; draw(); }); root.querySelectorAll('[data-theme]').forEach((el) => el.addEventListener('click', () => { state.theme = el.dataset.theme; draw(); })); bind('#np-autoscroll', () => { state.autoScroll = !state.autoScroll; draw(); }); bind('#np-notify', (el) => el.classList.toggle('on')); }
      function drawUpdate() {
        const sourceStatus = state.sourceUpdateAvailable ? '<span class="np-update-status available">有新版本可用</span>' : '<span class="np-update-status">已是最新</span>';
        content.innerHTML = `<p class="np-kicker">版本与更新</p><div class="np-update-card"><div class="np-update-head"><div class="np-update-icon">${icon('rocket')}</div><div class="np-update-copy"><h2 class="np-update-title">源码更新</h2><p class="np-update-description">更新 NKAS 自动化脚本源码</p></div></div><p class="np-version-line">当前版本 <span class="np-version">2026.09.09</span>${sourceStatus}</p><div class="np-update-actions"><button class="np-secondary" id="np-source-check" type="button">${icon('refresh-cw')}${state.updateChecking ? '检查中…' : '检查更新'}</button>${state.sourceUpdateAvailable ? `<button class="np-primary" id="np-source-apply" type="button">${icon('download')}立即更新</button>` : ''}<button class="np-danger-button" id="np-force-restart" type="button">${icon('power')}强制重启</button></div></div><div class="np-history"><div class="np-history-head">更新记录</div><div class="np-history-row"><p class="np-history-message">修复任务调度与设备连接问题</p><div class="np-history-meta"><span>a1b2c3d</span><span>2026-09-09</span><span>当前版本</span></div></div><div class="np-history-row"><p class="np-history-message">优化活动日历数据展示</p><div class="np-history-meta"><span>9f8e7d6</span><span>2026-09-02</span></div></div><div class="np-history-row"><p class="np-history-message">增加远程后端控制支持</p><div class="np-history-meta"><span>4c5d6e7</span><span>2026-08-28</span></div></div></div>`;
        bind('#np-source-check', () => { state.updateChecking = true; draw(); setTimeout(() => { state.updateChecking = false; state.sourceUpdateAvailable = true; draw(); }, 800); }); bind('#np-source-apply', () => { state.updating = true; draw(); setTimeout(() => { state.updating = false; state.sourceUpdateAvailable = false; draw(); }, 1100); }); bind('#np-force-restart', () => { state.restarting = true; draw(); setTimeout(() => { state.restarting = false; draw(); }, 900); });
      }
      function bind(selector, fn) { const el = root.querySelector(selector); if (el) el.addEventListener('click', () => fn(el)); }
      function openSheet(titleText, text, actions) { root.querySelector('#np-sheet-title').textContent = titleText; sheetText.textContent = text; sheetActions.innerHTML = actions.map((a) => `<button class="np-sheet-action ${a.primary ? 'primary' : ''}" data-sheet-action="${a.id}" type="button">${icon(a.icon)}${a.label}</button>`).join(''); sheet.classList.add('open'); removeImplementationNotes(sheet); sheetActions.querySelectorAll('[data-sheet-action]').forEach((el) => el.addEventListener('click', () => { const action = actions.find((a) => a.id === el.dataset.sheetAction); if (action && action.run) action.run(); })); if (window.lucide) lucide.createIcons({ attrs: { width: 16, height: 16 } }); }
      function closeSheet() { sheet.classList.remove('open'); }
      function openDeploy() { state.page = state.starAuthorized ? 'setup' : 'star-verify'; closeSheet(); draw(); }
      function openInit() { state.page = 'setup'; closeSheet(); draw(); }
      function openStarVerify() { state.page = 'star-verify'; closeSheet(); draw(); }
      function openBackendEditor() { state.page = 'backendAddress'; draw(); }
      function drawBackendAddress() {
        content.innerHTML = `<p class="np-subtitle">配置后端服务地址与安全入口</p><form id="np-backend-form" novalidate><section class="np-setting-group"><p class="np-group-label">连接地址</p><div class="np-form-card"><label class="np-form-label" for="np-backend-input">后端地址或完整安全入口</label><p class="np-form-help" id="np-backend-help">未开启安全入口时填写服务地址；已开启时粘贴完整 /entry/ 入口。</p><input id="np-backend-input" class="np-url-input" inputmode="url" autocomplete="off" spellcheck="false" aria-describedby="np-backend-help np-backend-error" placeholder="http://127.0.0.1:12271"><p class="np-form-help">例如 http://192.168.1.20:12271，公网建议使用 HTTPS。</p><p class="np-form-error" id="np-backend-error" role="alert" hidden></p></div></section><section class="np-setting-group"><p class="np-group-label">当前连接</p><div class="np-form-card"><p class="np-form-label">当前服务地址</p><p class="np-form-address" id="np-backend-current"></p></div></section><div class="np-form-actions"><button class="np-primary" type="submit">${icon('check')}保存并连接</button></div></form>`;
        const input = content.querySelector('#np-backend-input');
        const error = content.querySelector('#np-backend-error');
        input.value = state.backend;
        content.querySelector('#np-backend-current').textContent = state.backend;
        input.addEventListener('input', () => { error.hidden = true; input.removeAttribute('aria-invalid'); });
        content.querySelector('#np-backend-form').addEventListener('submit', (event) => {
          event.preventDefault();
          try {
            const value = input.value.trim();
            if (!value) throw new Error('请输入后端地址');
            const address = new URL(value.includes('://') ? value : `http://${value}`);
            if (!['http:', 'https:'].includes(address.protocol) || address.username || address.password) throw new Error('请输入有效的 HTTP 或 HTTPS 地址');
            state.backend = address.origin + address.pathname.split('/entry/')[0].replace(/\/$/, '');
            state.page = 'settings'; draw();
          } catch (exception) {
            error.textContent = exception.message;
            error.hidden = false;
            input.setAttribute('aria-invalid', 'true');
          }
        });
      }
      function openWebui() { openSheet('原始 WebUI', '这里打开当前后端提供的完整 WebUI，适合处理尚未原生实现的功能。', [{id:'open',icon:'external-link',label:'打开原始 WebUI',primary:true,run:closeSheet},{id:'cancel',icon:'x',label:'取消',run:closeSheet}]); }
      function openFilter() { openSheet('日志筛选', '选择要查看的日志级别。', ['全部','INFO','WARN','ERROR'].map((x) => ({id:x,icon:x === '全部' ? 'list-filter' : 'circle',label:x === state.filter ? `${x} · 当前` : x,primary:x === state.filter,run:() => { state.filter = x; closeSheet(); draw(); }})).concat([{id:'cancel',icon:'x',label:'取消',run:closeSheet}])); }
      root.querySelectorAll('.np-nav-item').forEach((el) => el.addEventListener('click', () => { state.page = el.dataset.page; draw(); }));
      root.querySelector('#np-page-back').addEventListener('click', () => { state.page = 'settings'; draw(); });
      sheet.addEventListener('click', (event) => { if (event.target === sheet) closeSheet(); });
      draw();
    })();
  </script>
</div>
</body>
</html>
